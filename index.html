<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>버미쌤 자막 제작기 V1</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef1f5;color:#17202a;font-family:Arial,"Noto Sans KR",sans-serif}.wrap{max-width:1320px;margin:20px auto;padding:0 18px 50px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}h1{font-size:24px;margin:0}.muted{color:#65707c;font-size:13px}.panel{background:#fff;border:1px solid #d9dee5;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 3px 14px #0000000a}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}input,textarea{border:1px solid #cbd2da;border-radius:9px;padding:10px;font-size:15px}input{height:40px}textarea{width:100%;resize:vertical}button{border:0;border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer;background:#0f2239;color:#fff}button.secondary{background:#e9edf2;color:#17202a}.preview{width:100%;aspect-ratio:16/9;background:#7d838c;border-radius:10px;overflow:hidden}canvas{width:100%;height:100%;display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.cards{display:grid;gap:8px}.card{border:1px solid #d7dde4;border-radius:10px;padding:10px;background:#fff}.card.active{outline:3px solid #8bb8ff}.card.locked{background:#f2fbf7;border-color:#8bd0b0}.cardtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}.num{font-weight:900}.badge{font-size:12px;padding:3px 7px;border-radius:999px;background:#eef1f5}.card.locked .badge{background:#d8f3e5;color:#087f5b}.caption{font-size:20px;min-height:58px}.status{padding:10px 12px;background:#f6f8fa;border-radius:8px;font-size:13px;margin-top:10px}.nav{display:flex;justify-content:space-between;align-items:center;margin-top:10px}@media(max-width:900px){.grid{grid-template-columns:1fr}}.miniActions{display:flex;gap:6px;margin-top:7px}.miniActions button{padding:5px 9px;font-size:12px;border-radius:7px}.pageStatus{display:inline-flex;align-items:center;gap:6px;margin-left:8px;font-size:13px;font-weight:700}.pageStatus.ok{color:#17823b}.pageStatus.warn{color:#d97706}</style></head><body><div class="wrap">
<header><div><h1>버미쌤 자막 제작기 V1</h1><div class="muted">V1.0.13 · 미확정 순차검수 · 10개 검수 · 개별/페이지 전체 확정 · PNG 저장</div></div><div class="muted" id="autosave">자동저장 대기</div><button class="secondary" onclick="checkUnconfirmed()">미확정 자막 확인하기</button></header>
<div class="panel"><div class="row"><input id="project" placeholder="작업명" style="flex:1;min-width:220px"><button id="newProject" class="secondary">새 작업</button><button id="resetPos" class="secondary">자막 위치 기본값</button><button id="savePng">현재 자막 PNG 저장</button></div></div>
<div class="panel"><div class="preview"><canvas id="preview" width="1920" height="1080"></canvas></div><div class="status">현재 GitHub 개발본 · 최종 PNG 1920×1080 투명 · 123RF 폰트는 PC에 설치된 로컬 폰트를 우선 사용</div></div>
<div class="grid"><div class="panel"><b>원본 대본</b><textarea id="source" rows="12" placeholder="완성 대본을 붙여넣으세요."></textarea><div class="row" style="margin-top:10px"><button id="split">자동 분할</button><span class="muted">현재 2차 분할 로직. 실제 렌더링 폭 기반 고도화 예정.</span></div></div>
<div class="panel"><div class="row" style="justify-content:flex-end;margin-bottom:10px"><button id="lockPage">이 페이지 전체 확정</button><button id="unlockPage" class="secondary">이 페이지 전체 잠금 해제</button></div><div class="cards" id="cards"></div><div class="nav"><button id="prev" class="secondary">← 이전 10개</button><b id="pageInfo">1 / 1</b><button id="next" class="secondary">다음 10개 →</button></div></div></div></div>
<script>
const W=1920,H=1080,navy='#0f2239',barImg=new Image(),cv=document.getElementById('preview'),ctx=cv.getContext('2d'),E=id=>document.getElementById(id),KEY='bummySubtitleV1_current';
barImg.src='./%EC%8B%AC%EB%B3%BC%2B%EC%9E%90%EB%A7%89%EB%B0%94.png?v=24180';
let state={project:'',source:'',subs:[{text:'자! 지금 기초연금 때문에 말들이 참 많죠?',locked:false}],selected:0,page:0,y:790};
function save(){state.project=E('project').value;state.source=E('source').value;localStorage.setItem(KEY,JSON.stringify(state));E('autosave').textContent='자동저장 완료 · '+new Date().toLocaleTimeString()}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.subs))state=x}catch(e){}E('project').value=state.project||'';E('source').value=state.source||''}
function rr(c,x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r)}
function draw(target,transparent=false,index=state.selected){const c=target.getContext('2d');c.clearRect(0,0,W,H);if(!transparent){c.fillStyle='#7d838c';c.fillRect(0,0,W,H)}const y=state.y,barW=1845,barH=175,x=Math.round((W-barW)/2),logoW=Math.round(barW*(146/1448));if(barImg.complete&&barImg.naturalWidth)c.drawImage(barImg,x,y,barW,barH);const text=(state.subs[index]?.text||'').replace(/\r/g,''),lines=text.split('\n').slice(0,2);c.fillStyle='#000';c.textAlign='center';c.textBaseline='middle';c.font='64px "123RF","123RF 원투쓰리알에프체",Arial,sans-serif';const cx=W/2+55,cy=y+barH/2;if(lines.length===1)c.fillText(lines[0],cx,cy+1);else{c.fillText(lines[0],cx,cy-34);c.fillText(lines[1],cx,cy+38)}}
function preview(){draw(cv,false)}
function splitCaption(i,ta){
 const text=state.subs[i]?.text||'';let p=ta.selectionStart;
 if(p<=0||p>=text.length){p=Math.round(text.length/2);while(p<text.length&&text[p]!==' ')p++;if(p>=text.length)p=Math.round(text.length/2)}
 const left=text.slice(0,p).trim(),right=text.slice(p).trim();if(!left||!right)return;
 state.subs[i]={...state.subs[i],text:left,locked:false};
 state.subs.splice(i+1,0,{text:right,locked:false});state.selected=i;save();render();
}
function mergeCaption(i){
 if(i>=state.subs.length-1)return;
 if(state.subs[i+1].locked){alert('다음 자막이 확정 상태입니다. 먼저 잠금을 해제해주세요.');return}
 state.subs[i]={...state.subs[i],text:(state.subs[i].text+' '+state.subs[i+1].text).replace(/\s+/g,' ').trim(),locked:false};
 state.subs.splice(i+1,1);state.selected=i;save();render();
}
function checkUnconfirmed(){
 const ids=state.subs.map((x,i)=>!x.locked?i:-1).filter(i=>i>=0);
 if(!ids.length){alert('모든 자막이 확정되었습니다.');return}
 let i=ids.find(x=>x>state.selected);
 if(i===undefined)i=ids[0];
 state.selected=i;state.page=Math.floor(i/10);save();render();
 setTimeout(()=>{const cards=[...document.querySelectorAll('.card')];const card=cards[i%10];if(card){card.style.outline='3px solid #ff5050';card.scrollIntoView({behavior:'smooth',block:'center'});const ta=card.querySelector('textarea');if(ta)ta.focus();}},0);
 E('autosave').textContent='미확정 '+String(i+1).padStart(3,'0')+' · 전체 '+ids.length+'개';
}
function render(){const start=state.page*10,end=Math.min(start+10,state.subs.length),box=E('cards');box.innerHTML='';for(let i=start;i<end;i++){const d=document.createElement('div');d.className='card'+(i===state.selected?' active':'')+(state.subs[i].locked?' locked':'');d.innerHTML='<div class="cardtop"><span class="num">'+String(i+1).padStart(3,'0')+'</span><span class="badge">'+(state.subs[i].locked?'확정':'미확정')+'</span></div><textarea class="caption" rows="2"></textarea><div class="miniActions"><button class="secondary splitBtn">분할</button><button class="secondary mergeBtn">합치기</button><button class="secondary pngBtn">↓ PNG</button></div>';const ta=d.querySelector('textarea');d.querySelector('.splitBtn').onclick=e=>{e.stopPropagation();splitCaption(i,ta)};d.querySelector('.mergeBtn').onclick=e=>{e.stopPropagation();mergeCaption(i)};d.querySelector('.pngBtn').onclick=e=>{e.stopPropagation();png(i)};ta.value=state.subs[i].text;d.onclick=e=>{if(e.target!==ta){state.selected=i;render()}};ta.onfocus=()=>{state.selected=i;preview()};ta.oninput=()=>{state.subs[i].text=ta.value;if(state.subs[i].locked)state.subs[i].locked=false;state.selected=i;save();preview()};ta.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();state.subs[i].locked=true;state.selected=i;save();render()}};box.appendChild(d)}const pages=Math.max(1,Math.ceil(state.subs.length/10)),ps=state.subs.slice(start,end),un=ps.filter(x=>!x.locked).length;E('pageInfo').innerHTML=(state.page+1)+' / '+pages+' <span class="pageStatus '+(un?'warn':'ok')+'">'+(un?'⚠ 미확정 '+un+'개':'✓ 전체 확정')+'</span>';preview()}
function splitSource(){
 const src=E('source').value.trim();if(!src)return;
 const normalized=src.replace(/\r/g,'').replace(/[ \t]+/g,' ').trim();
 const mc=document.createElement('canvas').getContext('2d');
 mc.font='64px "123RF","123RF 원투쓰리알에프체",Arial,sans-serif';
 const usableW=1450;
 const fits=t=>mc.measureText(t).width<=usableW;
 const sentences=normalized.split(/(?<=[.!?。！？])\s+|\n+/).map(x=>x.trim()).filter(Boolean);
 const out=[];
 function splitByWidth(sentence){
   const words=sentence.split(/\s+/).filter(Boolean),parts=[];let line='';
   for(const w of words){
     const cand=line?line+' '+w:w;
     if(fits(cand)){line=cand;continue}
     if(line){parts.push(line);line=''}
     if(fits(w)){line=w;continue}
     let chunk='';
     for(const ch of w){
       const cc=chunk+ch;
       if(fits(cc)) chunk=cc;
       else {if(chunk)parts.push(chunk);chunk=ch}
     }
     line=chunk;
   }
   if(line)parts.push(line);
   return parts;
 }
 for(const sentence of sentences){
   const parts=splitByWidth(sentence);
   for(const p of parts){
     if(out.length && mc.measureText(out[out.length-1]+' '+p).width<=usableW*0.92 && p.length<8) out[out.length-1]+=' '+p;
     else out.push(p);
   }
 }
 state.subs=out.map(text=>({text,locked:false}));state.selected=0;state.page=0;save();render();
}
function png(index){const o=document.createElement('canvas');o.width=W;o.height=H;draw(o,true,index);o.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=String(index+1).padStart(3,'0')+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)},'image/png')}
barImg.onload=()=>{render();};barImg.onerror=()=>{E('autosave').textContent='자막바 원본 로드 오류';};load();render();E('source').oninput=save;E('project').oninput=save;E('split').onclick=splitSource;E('savePng').onclick=()=>png(state.selected);E('resetPos').onclick=()=>{state.y=790;save();preview()};E('newProject').onclick=()=>{if(confirm('현재 작업을 새 작업으로 초기화할까요?')){state={project:'',source:'',subs:[{text:'',locked:false}],selected:0,page:0,y:790};localStorage.removeItem(KEY);load();render()}};E('lockPage').onclick=()=>{const s=state.page*10,e=Math.min(s+10,state.subs.length);for(let i=s;i<e;i++)state.subs[i].locked=true;save();render()};E('unlockPage').onclick=()=>{const s=state.page*10,e=Math.min(s+10,state.subs.length);for(let i=s;i<e;i++)state.subs[i].locked=false;save();render()};E('prev').onclick=()=>{if(state.page>0){state.page--;state.selected=state.page*10;save();render()}};E('next').onclick=()=>{const s=state.page*10,e=Math.min(s+10,state.subs.length),n=state.subs.slice(s,e).filter(x=>!x.locked).length;if(n&&!confirm('아직 확정하지 않은 자막이 '+n+'개 있습니다.\n그래도 다음으로 이동할까요?'))return;if((state.page+1)*10<state.subs.length){state.page++;state.selected=state.page*10;save();render()}};
</script></body></html>
