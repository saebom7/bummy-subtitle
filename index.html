<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>버미쌤 자막 제작기 V1</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef1f5;color:#17202a;font-family:Arial,"Noto Sans KR",sans-serif}.wrap{max-width:1320px;margin:20px auto;padding:0 18px 50px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}h1{font-size:24px;margin:0}.muted{color:#65707c;font-size:13px}.panel{background:#fff;border:1px solid #d9dee5;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 3px 14px #0000000a}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}input,textarea{border:1px solid #cbd2da;border-radius:9px;padding:10px;font-size:15px}input{height:40px}textarea{width:100%;resize:vertical}button{border:0;border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer;background:#0f2239;color:#fff}button.secondary{background:#e9edf2;color:#17202a}.preview{width:100%;aspect-ratio:16/9;background:#7d838c;border-radius:10px;overflow:hidden;cursor:ns-resize;user-select:none}canvas{width:100%;height:100%;display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.cards{display:grid;gap:8px}.card{border:1px solid #d7dde4;border-radius:10px;padding:10px;background:#fff}.card.active{outline:3px solid #8bb8ff}.card.locked{background:#f2fbf7;border-color:#8bd0b0}.cardtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}.num{font-weight:900}.badge{font-size:12px;padding:3px 7px;border-radius:999px;background:#eef1f5}.card.locked .badge{background:#d8f3e5;color:#087f5b}.caption{font-size:20px;min-height:58px}.status{padding:10px 12px;background:#f6f8fa;border-radius:8px;font-size:13px;margin-top:10px}.nav{display:flex;justify-content:space-between;align-items:center;margin-top:10px}@media(max-width:900px){.grid{grid-template-columns:1fr}}.miniActions{display:flex;gap:6px;margin-top:7px}.miniActions button{padding:5px 9px;font-size:12px;border-radius:7px}.pageStatus{display:inline-flex;align-items:center;gap:6px;margin-left:8px;font-size:13px;font-weight:700}.pageStatus.ok{color:#17823b}.pageStatus.warn{color:#d97706}.swatch{width:24px;height:24px;padding:0;border:2px solid #d7dde4;border-radius:6px}.sourceMark{background:#fff3a3;border-radius:3px}.pageTabs{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}.pageTab{padding:6px 9px;font-size:12px}.pageTab.ok{background:#17823b}.pageTab.warn{background:#d97706}.bgThumb{width:54px;height:34px;object-fit:cover;border-radius:5px;border:1px solid #cbd2da}</style><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script></head><body><div class="wrap">
<header><div><h1>버미쌤 자막 제작기 V1</h1><div class="muted">V1.0.38 · 기본 자막 원본 굵기 보정 · 10개 검수 · 개별/페이지 전체 확정 · PNG 저장</div></div><div class="muted" id="autosave">자동저장 대기</div><button class="secondary" onclick="checkUnconfirmed()">미확정 자막 확인하기</button></header>
<div class="panel"><div class="row"><input id="project" placeholder="작업명" style="flex:1;min-width:220px"><button id="newProject" class="secondary">새 작업</button><select id="recentProjects" title="최근 작업" style="height:40px;border:1px solid #cbd2da;border-radius:9px;padding:0 8px"><option value="">최근 작업</option></select><button id="resetPos" class="secondary">자막 위치 기본값</button><button id="savePng">현재 자막 PNG 저장</button><input id="textColor" type="color" value="#ffc000" title="글자 색상" style="width:44px;padding:3px"><button id="applyColor" class="secondary">선택 글자 색상</button><span id="recentColors" class="row" style="gap:4px"></span><button id="favoriteColor" class="secondary" title="현재 색상 즐겨찾기">☆ 색상 저장</button><span id="favoriteColors" class="row" style="gap:4px"></span><button id="applyBold" class="secondary">선택 글자 굵게</button><span class="muted">기본 굵기</span><input id="weightSlider" type="range" min="200" max="400" step="5" value="300" style="width:130px"><b id="weightValue">400</b><button id="saveWeight" class="secondary">굵기 저장</button><button id="applyWeightAll" class="secondary">전체 적용</button><button id="batchZip">전체 PNG ZIP</button></div></div>
<div class="panel"><div class="preview"><canvas id="preview" width="1920" height="1080"></canvas></div><div class="status">현재 GitHub 개발본 · 최종 PNG 1920×1080 투명 · 123RF 폰트는 PC에 설치된 로컬 폰트를 우선 사용</div><div class="row" style="margin-top:10px"><label class="secondary" style="padding:8px 10px;border-radius:9px;cursor:pointer;font-weight:800">미리보기 배경 추가<input id="bgFiles" type="file" accept="image/*" multiple hidden></label><button id="clearBg" class="secondary">배경 전체삭제</button><span id="bgAlbum" class="row" style="gap:5px"></span></div></div>
<div class="grid"><div class="panel"><div class="row" style="justify-content:space-between"><b>원본 대본</b><button id="toggleSource" class="secondary">접기</button></div><div id="sourceBody"><textarea id="source" rows="12" placeholder="완성 대본을 붙여넣으세요."></textarea><div class="row" style="margin-top:10px"><button id="split">자동 분할</button><button id="applySource" class="secondary">수정 내용 자막에 반영</button><span class="muted">실제 렌더링 폭 기반 자동 분할</span></div></div></div>
<div class="panel"><div class="row" style="justify-content:flex-end;margin-bottom:10px"><button id="lockPage">이 페이지 전체 확정</button><button id="unlockPage" class="secondary">이 페이지 전체 잠금 해제</button></div><div id="pageTabs" class="pageTabs"></div><div class="cards" id="cards"></div><div class="nav"><button id="prev" class="secondary">← 이전 10개</button><b id="pageInfo">1 / 1</b><button id="next" class="secondary">다음 10개 →</button></div></div></div></div>
<script>
const W=1920,H=1080,navy='#0f2239',barImg=new Image(),cv=document.getElementById('preview'),ctx=cv.getContext('2d'),E=id=>document.getElementById(id),KEY='bummySubtitleV1_current';
barImg.src='./%EC%8B%AC%EB%B3%BC%2B%EC%9E%90%EB%A7%89%EB%B0%94.png?v=24180';
let state={project:'',source:'',subs:[{text:'자! 지금 기초연금 때문에 말들이 참 많죠?',locked:false}],selected:0,page:0,y:790,sourceCollapsed:false,recovered:false,baseWeight:400};
let undoStack=[],redoStack=[],formatClipboard=null,lastSnapshot='';
function save(track=true){state.project=E('project').value;state.source=E('source').value;const snap=JSON.stringify(state);if(track&&lastSnapshot&&snap!==lastSnapshot){undoStack.push(lastSnapshot);if(undoStack.length>60)undoStack.shift();redoStack=[]}lastSnapshot=snap;localStorage.setItem(KEY,snap);saveProjectSnapshot();E('autosave').textContent='자동저장 완료 · '+new Date().toLocaleTimeString()}
function restoreSnapshot(snap){try{state=JSON.parse(snap);lastSnapshot=snap;localStorage.setItem(KEY,snap);E('project').value=state.project||'';E('source').value=state.source||'';render()}catch(e){}}
function undo(){if(!undoStack.length)return;redoStack.push(JSON.stringify(state));restoreSnapshot(undoStack.pop())}
function redo(){if(!redoStack.length)return;undoStack.push(JSON.stringify(state));restoreSnapshot(redoStack.pop())}
function load(){let recovered=false;try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.subs)){state=x;recovered=true}}catch(e){}E('project').value=state.project||'';E('source').value=state.source||'';if(!state.baseWeight)state.baseWeight=Number(localStorage.getItem(WEIGHTKEY))||300;lastSnapshot=JSON.stringify(state);setTimeout(()=>{setWeightUI(state.baseWeight||300);E('sourceBody').style.display=state.sourceCollapsed?'none':'block';E('toggleSource').textContent=state.sourceCollapsed?'펼치기':'접기';if(recovered)E('autosave').textContent='최근 작업 자동복구 완료'},0)}
function rr(c,x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r)}
const PROJECTKEY='bummySubtitleV1_projects',FAVCOLORKEY='bummySubtitle_favoriteColors';
let previewBg=null;
function bgDB(){return new Promise((res,rej)=>{const q=indexedDB.open('bummySubtitleDB',1);q.onupgradeneeded=()=>q.result.createObjectStore('backgrounds',{keyPath:'id',autoIncrement:true});q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function bgList(){const db=await bgDB();return new Promise(r=>{const q=db.transaction('backgrounds').objectStore('backgrounds').getAll();q.onsuccess=()=>r(q.result||[])})}
async function addBackgrounds(files){const db=await bgDB(),old=await bgList(),room=Math.max(0,5-old.length);for(const file of [...files].slice(0,room)){await new Promise(r=>{const q=db.transaction('backgrounds','readwrite').objectStore('backgrounds').add({blob:file});q.onsuccess=r})}await loadRandomBg()}
async function clearBackgrounds(){const db=await bgDB();await new Promise(r=>{const q=db.transaction('backgrounds','readwrite').objectStore('backgrounds').clear();q.onsuccess=r});previewBg=null;renderBgAlbum();preview()}
async function loadRandomBg(){const a=await bgList();if(previewBg)URL.revokeObjectURL(previewBg);previewBg=a.length?URL.createObjectURL(a[Math.floor(Math.random()*a.length)].blob):null;renderBgAlbum();preview()}
async function renderBgAlbum(){const a=await bgList(),box=E('bgAlbum');if(!box)return;box.innerHTML='';for(const x of a){const im=document.createElement('img');im.className='bgThumb';im.src=URL.createObjectURL(x.blob);box.appendChild(im)}}
function startNewProject(){const name=prompt('새 작업 이름을 입력해주세요.');if(!name||!name.trim())return;state={project:name.trim(),source:'',subs:[{text:'',locked:false}],selected:0,page:0,y:790,sourceCollapsed:false,recovered:false,baseWeight:Number(localStorage.getItem(WEIGHTKEY))||300};undoStack=[];redoStack=[];lastSnapshot='';E('project').value=state.project;E('source').value='';localStorage.removeItem(KEY);save(false);render()}

function projectStore(){try{return JSON.parse(localStorage.getItem(PROJECTKEY))||{}}catch(e){return{}}}
function saveProjectSnapshot(){
 const name=(state.project||'').trim();if(!name)return;
 const db=projectStore();db[name]={updated:Date.now(),state:JSON.parse(JSON.stringify(state))};localStorage.setItem(PROJECTKEY,JSON.stringify(db));renderRecentProjects();
}
function renderRecentProjects(){
 const el=E('recentProjects');if(!el)return;const cur=el.value,db=projectStore();el.innerHTML='<option value="">최근 작업</option>';
 Object.entries(db).sort((a,b)=>b[1].updated-a[1].updated).forEach(([name,v])=>{const o=document.createElement('option');o.value=name;o.textContent=name+' · '+new Date(v.updated).toLocaleDateString()+' · '+(v.state.subs?.length||0)+'개';el.appendChild(o)});el.value=cur;
}
function loadRecentProject(name){const x=projectStore()[name];if(!x)return;state=JSON.parse(JSON.stringify(x.state));lastSnapshot=JSON.stringify(state);E('project').value=state.project||'';E('source').value=state.source||'';localStorage.setItem(KEY,lastSnapshot);render()}
function getFavColors(){try{return JSON.parse(localStorage.getItem(FAVCOLORKEY))||[]}catch(e){return[]}}
function renderFavoriteColors(){const box=E('favoriteColors');if(!box)return;box.innerHTML='';for(const c of getFavColors()){const b=document.createElement('button');b.className='swatch';b.style.background=c;b.title=c+' · 우클릭 삭제';b.onclick=()=>{E('textColor').value=c;applySelectedColor()};b.oncontextmenu=e=>{e.preventDefault();localStorage.setItem(FAVCOLORKEY,JSON.stringify(getFavColors().filter(x=>x!==c)));renderFavoriteColors()};box.appendChild(b)}}
const WEIGHTKEY='bummySubtitle_defaultWeight';
function setWeightUI(v){v=Math.max(200,Math.min(400,Number(v)||300));E('weightSlider').value=v;E('weightValue').textContent=v;state.baseWeight=v;preview()}
function saveDefaultWeight(){localStorage.setItem(WEIGHTKEY,String(state.baseWeight||300));save();E('autosave').textContent='기본 굵기 '+(state.baseWeight||300)+' 저장 완료'}
function applyWeightAll(){const v=Number(E('weightSlider').value);state.baseWeight=v;for(const sub of state.subs){sub.baseWeight=v;sub.locked=false}save();render();E('autosave').textContent='전체 자막 굵기 '+v+' 적용 완료'}
function saveFavoriteColor(){const c=E('textColor').value,a=getFavColors();if(!a.includes(c)){a.push(c);localStorage.setItem(FAVCOLORKEY,JSON.stringify(a))}renderFavoriteColors()}
function captureSelectedFormat(){
 const r=selectedRange();if(!r||r.start===r.end)return null;const sub=state.subs[r.i],styles=[];for(let p=r.start;p<r.end;p++)styles.push(styleAt(sub,p));return styles;
}
function pasteSelectedFormat(){
 const r=selectedRange();if(!r||r.start===r.end||!Array.isArray(formatClipboard)||!formatClipboard.length)return;
 const sub=state.subs[r.i];for(let p=r.start;p<r.end;p++){const st=formatClipboard[(p-r.start)%formatClipboard.length];ensureRuns(sub).push({start:p,end:p+1,color:st.color,bold:st.bold})}sub.locked=false;save();render();
}
function applySourceChanges(){
 const locked=state.subs.map((x,i)=>x.locked?i+1:null).filter(Boolean);
 if(locked.length&&!confirm('수정 내용을 반영하면 확정 자막도 다시 분할될 수 있습니다.\n영향 가능 자막: '+locked.join(', ')+'\n잠금을 해제하고 반영할까요?'))return;
 state.subs.forEach(x=>x.locked=false);splitSource();
}
const COLORKEY='bummySubtitle_recentColors';
function getRecentColors(){try{return JSON.parse(localStorage.getItem(COLORKEY))||[]}catch(e){return[]}}
function rememberColor(c){let a=getRecentColors().filter(x=>x!==c);a.unshift(c);a=a.slice(0,6);localStorage.setItem(COLORKEY,JSON.stringify(a));renderRecentColors()}
function renderRecentColors(){const box=E('recentColors');if(!box)return;box.innerHTML='';for(const c of getRecentColors()){const b=document.createElement('button');b.className='swatch';b.style.background=c;b.title=c;b.onclick=()=>{E('textColor').value=c;applySelectedColor()};box.appendChild(b)}}
async function batchZip(){
 const ids=state.subs.map((x,i)=>!x.locked?i:-1).filter(i=>i>=0);
 if(ids.length&&!confirm('미확정 자막: '+ids.map(i=>i+1).join(', ')+'\n그래도 전체 PNG를 출력할까요?'))return;
 if(typeof JSZip==='undefined'){alert('ZIP 모듈을 불러오지 못했습니다. 인터넷 연결 후 다시 시도해주세요.');return}
 const zip=new JSZip();
 for(let i=0;i<state.subs.length;i++){E('autosave').textContent='PNG 생성 중 · '+(i+1)+' / '+state.subs.length;const o=document.createElement('canvas');o.width=W;o.height=H;draw(o,true,i);const blob=await new Promise(r=>o.toBlob(r,'image/png'));zip.file(String(i+1).padStart(3,'0')+'.png',blob)}
 const blob=await zip.generateAsync({type:'blob'}),a=document.createElement('a'),name=(state.project||'버미쌤_자막').replace(/[\\/:*?"<>|]/g,'_');a.href=URL.createObjectURL(blob);a.download=name+'.zip';a.click();E('autosave').textContent='ZIP 출력 완료 · '+state.subs.length+'개';setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function mapSourceRanges(){
 const src=E('source').value;let cursor=0;
 for(const sub of state.subs){const clean=(sub.text||'').replace(/\n/g,' ').trim();let p=src.indexOf(clean,cursor);if(p<0){const first=clean.split(/\s+/)[0]||'';p=first?src.indexOf(first,cursor):-1}sub.sourceStart=p>=0?p:null;sub.sourceEnd=p>=0?p+clean.length:null;if(p>=0)cursor=sub.sourceEnd}
}
function highlightSourceFor(i){
 const sub=state.subs[i],ta=E('source');if(!sub||sub.sourceStart==null)return;
 ta.focus();ta.setSelectionRange(sub.sourceStart,sub.sourceEnd);ta.scrollTop=Math.max(0,(sub.sourceStart/Math.max(1,ta.value.length))*ta.scrollHeight-ta.clientHeight/2);
}
let activeTA=null;
function ensureRuns(sub){if(!sub.runs)sub.runs=[];return sub.runs}
function addRunStyle(i,start,end,patch){
 if(start===end)return;
 const sub=state.subs[i];ensureRuns(sub).push({start,end,...patch});sub.locked=false;save();render();
 setTimeout(()=>{const ta=[...document.querySelectorAll('.caption')][i-state.page*10];if(ta){ta.focus();ta.setSelectionRange(start,end);activeTA=ta}},0);
}
function selectedRange(){if(!activeTA)return null;return {i:state.selected,start:activeTA.selectionStart,end:activeTA.selectionEnd}}
function rangeAllHas(r,key,value){const sub=state.subs[r.i];for(let p=r.start;p<r.end;p++){const st=styleAt(sub,p);if(key==='color'&&st.color!==value)return false;if(key==='bold'&&st.bold!==value)return false}return true}
function applySelectedColor(){const r=selectedRange();if(!r||r.start===r.end)return;const color=E('textColor').value,on=rangeAllHas(r,'color',color);if(!on)rememberColor(color);addRunStyle(r.i,r.start,r.end,{color:on?'#000':color})}
function applySelectedBold(){const r=selectedRange();if(!r||r.start===r.end)return;const on=rangeAllHas(r,'bold',true);addRunStyle(r.i,r.start,r.end,{bold:!on})}
function styleAt(sub,pos){let st={color:'#000',bold:false};for(const r of (sub.runs||[])){if(pos>=r.start&&pos<r.end){if(r.color)st.color=r.color;if(r.bold!==undefined)st.bold=r.bold}}return st}
function drawStyledLine(c,line,offset,cx,cy,sub){
 const chars=[...line];if(!chars.length)return;
 const segs=[];let cur=null;
 chars.forEach((ch,k)=>{const st=styleAt(sub,offset+k),key=st.color+'|'+st.bold;if(!cur||cur.key!==key){cur={key,text:'',st};segs.push(cur)}cur.text+=ch});
 const base=state.baseWeight||300,native=base<325?200:base<375?300:400;
 const width=segs.reduce((sum,g)=>{const wt=g.st.bold?Math.min(500,native+100):native;c.font=wt+' 64px "123RF","123RF 원투쓰리알에프체",Arial,sans-serif';return sum+c.measureText(g.text).width},0);
 let x=cx-width/2;c.textAlign='left';
 for(const g of segs){const wt=g.st.bold?Math.min(500,native+100):native;c.font=wt+' 64px "123RF","123RF 원투쓰리알에프체",Arial,sans-serif';c.fillStyle=g.st.color;const w=c.measureText(g.text).width;c.fillText(g.text,x,cy);x+=w}
 c.textAlign='center';
}
function draw(target,transparent=false,index=state.selected){const c=target.getContext('2d');c.clearRect(0,0,W,H);if(!transparent){if(previewBg){const im=new Image();im.src=previewBg;if(im.complete)c.drawImage(im,0,0,W,H);else{c.fillStyle='#7d838c';c.fillRect(0,0,W,H);im.onload=preview}}else{c.fillStyle='#7d838c';c.fillRect(0,0,W,H)}}const y=state.y,barW=1845,barH=175,x=Math.round((W-barW)/2),logoW=Math.round(barW*(146/1448));if(barImg.complete&&barImg.naturalWidth)c.drawImage(barImg,x,y,barW,barH);const text=(state.subs[index]?.text||'').replace(/\r/g,''),lines=text.split('\n').slice(0,2);c.textAlign='center';c.textBaseline='middle';const cx=W/2+55,cy=y+barH/2,sub=state.subs[index]||{runs:[]};if(lines.length===1)drawStyledLine(c,lines[0],0,cx,cy+1,sub);else{drawStyledLine(c,lines[0],0,cx,cy-34,sub);drawStyledLine(c,lines[1],lines[0].length+1,cx,cy+38,sub)}}
function preview(){draw(cv,false)}
function splitCaption(i,ta){
 const text=state.subs[i]?.text||'';let p=ta.selectionStart;
 if(p<=0||p>=text.length){p=Math.round(text.length/2);while(p<text.length&&text[p]!==' ')p++;if(p>=text.length)p=Math.round(text.length/2)}
 const left=text.slice(0,p).trim(),right=text.slice(p).trim();if(!left||!right)return;
 state.subs[i]={...state.subs[i],text:left,locked:false};
 state.subs.splice(i+1,0,{text:right,locked:false});state.selected=i;save();render();
}
function mergeCaption(i){
 if(i>=state.subs.length-1)return;
 if(state.subs[i+1].locked){alert('다음 자막이 확정 상태입니다. 먼저 잠금을 해제해주세요.');return}
 state.subs[i]={...state.subs[i],text:(state.subs[i].text+' '+state.subs[i+1].text).replace(/\s+/g,' ').trim(),locked:false};
 state.subs.splice(i+1,1);state.selected=i;save();render();
}
function checkUnconfirmed(){
 const ids=state.subs.map((x,i)=>!x.locked?i:-1).filter(i=>i>=0);
 if(!ids.length){alert('모든 자막이 확정되었습니다.');return}
 let i=ids.find(x=>x>state.selected);
 if(i===undefined)i=ids[0];
 state.selected=i;state.page=Math.floor(i/10);save();render();
 setTimeout(()=>{const cards=[...document.querySelectorAll('.card')];const card=cards[i%10];if(card){card.style.outline='3px solid #ff5050';card.scrollIntoView({behavior:'smooth',block:'center'});const ta=card.querySelector('textarea');if(ta)ta.focus();}},0);
 E('autosave').textContent='미확정 '+String(i+1).padStart(3,'0')+' · 전체 '+ids.length+'개';
}
function render(){const start=state.page*10,end=Math.min(start+10,state.subs.length),box=E('cards');box.innerHTML='';for(let i=start;i<end;i++){const d=document.createElement('div');d.className='card'+(i===state.selected?' active':'')+(state.subs[i].locked?' locked':'');d.innerHTML='<div class="cardtop"><span class="num">'+String(i+1).padStart(3,'0')+'</span><span class="badge">'+(state.subs[i].locked?'확정':'미확정')+'</span></div><textarea class="caption" rows="2"></textarea><div class="miniActions"><button class="secondary splitBtn">분할</button><button class="secondary mergeBtn">합치기</button><button class="secondary pngBtn">↓ PNG</button></div>';const ta=d.querySelector('textarea');d.querySelector('.splitBtn').onclick=e=>{e.stopPropagation();splitCaption(i,ta)};d.querySelector('.mergeBtn').onclick=e=>{e.stopPropagation();mergeCaption(i)};d.querySelector('.pngBtn').onclick=e=>{e.stopPropagation();png(i)};ta.value=state.subs[i].text;d.onclick=e=>{if(e.target!==ta){state.selected=i;render();setTimeout(()=>highlightSourceFor(i),0)}};ta.onfocus=()=>{state.selected=i;activeTA=ta;preview()};ta.onselect=()=>{state.selected=i;activeTA=ta};ta.oninput=()=>{state.subs[i].text=ta.value;state.subs[i].runs=[];if(state.subs[i].locked)state.subs[i].locked=false;state.selected=i;activeTA=ta;save();preview()};ta.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();state.subs[i].locked=true;state.selected=i;save();render()}};box.appendChild(d)}const pages=Math.max(1,Math.ceil(state.subs.length/10)),ps=state.subs.slice(start,end),un=ps.filter(x=>!x.locked).length;E('pageInfo').innerHTML=(state.page+1)+' / '+pages+' <span class="pageStatus '+(un?'warn':'ok')+'">'+(un?'⚠ 미확정 '+un+'개':'✓ 전체 확정')+'</span>';const tabs=E('pageTabs');tabs.innerHTML='';for(let p=0;p<pages;p++){const arr=state.subs.slice(p*10,p*10+10),u=arr.filter(x=>!x.locked).length,b=document.createElement('button');b.className='pageTab '+(u?'warn':'ok');b.textContent=(p+1)+(u?' ⚠'+u:' ✓');b.onclick=()=>{state.page=p;state.selected=Math.min(p*10,state.subs.length-1);save(false);render()};tabs.appendChild(b)}preview()}
function splitSource(){
 const src=E('source').value.trim();if(!src)return;
 const normalized=src.replace(/\r/g,'').replace(/[ \t]+/g,' ').trim();
 const mc=document.createElement('canvas').getContext('2d');
 mc.font=(state.baseWeight||300)+' 64px "123RF","123RF 원투쓰리알에프체",Arial,sans-serif';
 const usableW=1450;
 const fits=t=>mc.measureText(t).width<=usableW;
 const sentences=normalized.split(/(?<=[.!?。！？])\s+|\n+/).map(x=>x.trim()).filter(Boolean);
 const out=[];
 function splitByWidth(sentence){
   const words=sentence.split(/\s+/).filter(Boolean),parts=[];let line='';
   for(const w of words){
     const cand=line?line+' '+w:w;
     if(fits(cand)){line=cand;continue}
     if(line){parts.push(line);line=''}
     if(fits(w)){line=w;continue}
     let chunk='';
     for(const ch of w){
       const cc=chunk+ch;
       if(fits(cc)) chunk=cc;
       else {if(chunk)parts.push(chunk);chunk=ch}
     }
     line=chunk;
   }
   if(line)parts.push(line);
   return parts;
 }
 for(const sentence of sentences){
   const parts=splitByWidth(sentence);
   for(const p of parts){
     if(out.length && mc.measureText(out[out.length-1]+' '+p).width<=usableW*0.92 && p.length<8) out[out.length-1]+=' '+p;
     else out.push(p);
   }
 }
 state.subs=out.map(text=>({text,locked:false}));state.selected=0;state.page=0;mapSourceRanges();save();render();
}
function png(index){const o=document.createElement('canvas');o.width=W;o.height=H;draw(o,true,index);o.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=String(index+1).padStart(3,'0')+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)},'image/png')}
let draggingBar=false;
function setBarYFromPointer(e){
 const r=cv.getBoundingClientRect(),scale=H/r.height;
 state.y=Math.max(0,Math.min(H-175,Math.round((e.clientY-r.top)*scale-87.5)));
 save();preview();
}
cv.addEventListener('pointerdown',e=>{draggingBar=true;cv.setPointerCapture(e.pointerId);setBarYFromPointer(e)});
cv.addEventListener('pointermove',e=>{if(draggingBar)setBarYFromPointer(e)});
cv.addEventListener('pointerup',e=>{draggingBar=false;try{cv.releasePointerCapture(e.pointerId)}catch(_){}});

E('source').addEventListener('click',()=>{const p=E('source').selectionStart;let best=-1;for(let i=0;i<state.subs.length;i++){const q=state.subs[i];if(q.sourceStart!=null&&p>=q.sourceStart&&p<=q.sourceEnd){best=i;break}}if(best>=0){state.selected=best;state.page=Math.floor(best/10);save(false);render()}});

document.addEventListener('keydown',e=>{
 if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&e.key.toLowerCase()==='b'){e.preventDefault();applySelectedBold();return}
 if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&e.key.toLowerCase()==='z'){e.preventDefault();undo();return}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();redo();return}
 if((e.ctrlKey||e.metaKey)&&e.shiftKey&&e.key.toLowerCase()==='c'){e.preventDefault();const sub=state.subs[state.selected];formatClipboard=captureSelectedFormat();E('autosave').textContent=formatClipboard?'서식 복사 완료':'복사할 글자를 선택해주세요';return}
 if((e.ctrlKey||e.metaKey)&&e.shiftKey&&e.key.toLowerCase()==='v'){e.preventDefault();if(formatClipboard===null)return;pasteSelectedFormat();E('autosave').textContent='서식 붙여넣기 완료';return}
});
barImg.onload=()=>{render();};barImg.onerror=()=>{E('autosave').textContent='자막바 원본 로드 오류';};load();render();E('source').oninput=save;E('project').oninput=save;E('split').onclick=splitSource;E('savePng').onclick=()=>png(state.selected);E('resetPos').onclick=()=>{state.y=790;save();preview()};E('newProject').onclick=startNewProject;E('bgFiles').onchange=e=>addBackgrounds(e.target.files);E('clearBg').onclick=clearBackgrounds;loadRandomBg();E('lockPage').onclick=()=>{const s=state.page*10,e=Math.min(s+10,state.subs.length);for(let i=s;i<e;i++)state.subs[i].locked=true;save();render()};E('unlockPage').onclick=()=>{const s=state.page*10,e=Math.min(s+10,state.subs.length);for(let i=s;i<e;i++)state.subs[i].locked=false;save();render()};E('prev').onclick=()=>{if(state.page>0){state.page--;state.selected=state.page*10;save();render()}};E('next').onclick=()=>{const s=state.page*10,e=Math.min(s+10,state.subs.length),n=state.subs.slice(s,e).filter(x=>!x.locked).length;if(n&&!confirm('아직 확정하지 않은 자막이 '+n+'개 있습니다.\n그래도 다음으로 이동할까요?'))return;if((state.page+1)*10<state.subs.length){state.page++;state.selected=state.page*10;save();render()}};
