<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>버미쌤 자막 제작기 V1</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef1f5;color:#17202a;font-family:Arial,"Noto Sans KR",sans-serif}.wrap{max-width:1320px;margin:20px auto;padding:0 18px 50px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}h1{font-size:24px;margin:0}.muted{color:#65707c;font-size:13px}.panel{background:#fff;border:1px solid #d9dee5;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 3px 14px #0000000a}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}input,textarea{border:1px solid #cbd2da;border-radius:9px;padding:10px;font-size:15px}input{height:40px}textarea{width:100%;resize:vertical}button{border:0;border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer;background:#0f2239;color:#fff}button.secondary{background:#e9edf2;color:#17202a}.preview{width:100%;aspect-ratio:16/9;background:#7d838c;border-radius:10px;overflow:hidden}canvas{width:100%;height:100%;display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.cards{display:grid;gap:8px}.card{border:1px solid #d7dde4;border-radius:10px;padding:10px;background:#fff}.card.active{outline:3px solid #8bb8ff}.card.locked{background:#f2fbf7;border-color:#8bd0b0}.cardtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}.num{font-weight:900}.badge{font-size:12px;padding:3px 7px;border-radius:999px;background:#eef1f5}.card.locked .badge{background:#d8f3e5;color:#087f5b}.caption{font-size:20px;min-height:58px}.status{padding:10px 12px;background:#f6f8fa;border-radius:8px;font-size:13px;margin-top:10px}.nav{display:flex;justify-content:space-between;align-items:center;margin-top:10px}@media(max-width:900px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap">
<header><div><h1>버미쌤 자막 제작기 V1</h1><div class="muted">GitHub 실시간 개발본 · 10개 검수 · 개별/페이지 전체 확정 · PNG 저장</div></div><div class="muted" id="autosave">자동저장 대기</div></header>
<div class="panel"><div class="row"><input id="project" placeholder="작업명" style="flex:1;min-width:220px"><button id="newProject" class="secondary">새 작업</button><button id="resetPos" class="secondary">자막 위치 기본값</button><button id="savePng">현재 자막 PNG 저장</button></div></div>
<div class="panel"><div class="preview"><canvas id="preview" width="1920" height="1080"></canvas></div><div class="status">현재 GitHub 개발본 · 최종 PNG 1920×1080 투명 · 123RF 폰트는 PC에 설치된 로컬 폰트를 우선 사용</div></div>
<div class="grid"><div class="panel"><b>원본 대본</b><textarea id="source" rows="12" placeholder="완성 대본을 붙여넣으세요."></textarea><div class="row" style="margin-top:10px"><button id="split">자동 분할</button><span class="muted">현재 2차 분할 로직. 실제 렌더링 폭 기반 고도화 예정.</span></div></div>
<div class="panel"><div class="row" style="justify-content:flex-end;margin-bottom:10px"><button id="lockPage">이 페이지 전체 확정</button><button id="unlockPage" class="secondary">이 페이지 전체 잠금 해제</button></div><div class="cards" id="cards"></div><div class="nav"><button id="prev" class="secondary">← 이전 10개</button><b id="pageInfo">1 / 1</b><button id="next" class="secondary">다음 10개 →</button></div></div></div></div>
<script>
const W=1920,H=1080,navy='#0f2239',cv=document.getElementById('preview'),ctx=cv.getContext('2d'),E=id=>document.getElementById(id),KEY='bummySubtitleV1_current';
let state={project:'',source:'',subs:[{text:'자! 지금 기초연금 때문에 말들이 참 많죠?',locked:false}],selected:0,page:0,y:790};
function save(){state.project=E('project').value;state.source=E('source').value;localStorage.setItem(KEY,JSON.stringify(state));E('autosave').textContent='자동저장 완료 · '+new Date().toLocaleTimeString()}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.subs))state=x}catch(e){}E('project').value=state.project||'';E('source').value=state.source||''}
function rr(c,x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r)}
function draw(target,transparent=false,index=state.selected){const c=target.getContext('2d');c.clearRect(0,0,W,H);if(!transparent){c.fillStyle='#7d838c';c.fillRect(0,0,W,H)}const barH=182,y=state.y,logoW=194;c.fillStyle='#fff';c.strokeStyle=navy;c.lineWidth=6;rr(c,3,y+3,W-6,barH-6,28);c.fill();c.stroke();c.fillStyle=navy;rr(c,3,y+3,logoW,barH-6,28);c.fill();c.fillStyle='#fff';c.textAlign='center';c.textBaseline='middle';c.font='700 42px Arial';c.fillText('BUMMY',logoW/2,y+barH/2);const text=(state.subs[index]?.text||'').replace(/\r/g,''),lines=text.split('\n').slice(0,2);c.fillStyle='#000';c.font='64px "123RF","123RF 원투쓰리알에프체",Arial,sans-serif';const cx=logoW+(W-logoW)/2,cy=y+barH/2;if(lines.length===1)c.fillText(lines[0],cx,cy);else{c.fillText(lines[0],cx,cy-38);c.fillText(lines[1],cx,cy+38)}}
function preview(){draw(cv,false)}
function render(){const start=state.page*10,end=Math.min(start+10,state.subs.length),box=E('cards');box.innerHTML='';for(let i=start;i<end;i++){const d=document.createElement('div');d.className='card'+(i===state.selected?' active':'')+(state.subs[i].locked?' locked':'');d.innerHTML='<div class="cardtop"><span class="num">'+String(i+1).padStart(3,'0')+'</span><span class="badge">'+(state.subs[i].locked?'확정':'미확정')+'</span></div><textarea class="caption" rows="2"></textarea>';const ta=d.querySelector('textarea');ta.value=state.subs[i].text;d.onclick=e=>{if(e.target!==ta){state.selected=i;render()}};ta.onfocus=()=>{state.selected=i;preview()};ta.oninput=()=>{state.subs[i].text=ta.value;if(state.subs[i].locked)state.subs[i].locked=false;state.selected=i;save();preview()};ta.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();state.subs[i].locked=true;state.selected=i;save();render()}};box.appendChild(d)}E('pageInfo').textContent=(state.page+1)+' / '+Math.max(1,Math.ceil(state.subs.length/10));preview()}
function splitSource(){const src=E('source').value.trim();if(!src)return;const normalized=src.replace(/\r/g,'').replace(/[ \t]+/g,' ').trim();let sentences=normalized.split(/(?<=[.!?。！？])\s+|\n+/).map(x=>x.trim()).filter(Boolean),out=[],MAX=36,MIN=10;function smart(s){if(s.length<=MAX)return[s];let r=[],rest=s.trim();while(rest.length>MAX){let cand=[];for(let i=MIN;i<=Math.min(MAX,rest.length-1);i++){const a=rest[i-1],b=rest[i];if(a===' '||b===' '||a===','||a==='，')cand.push(i)}let cut=cand.length?cand[cand.length-1]:MAX,left=rest.slice(0,cut).trim(),right=rest.slice(cut).trim();if(left.length<MIN){cut=Math.min(MAX,rest.length);left=rest.slice(0,cut).trim();right=rest.slice(cut).trim()}r.push(left);rest=right}if(rest)r.push(rest);return r}for(const s of sentences)for(const p of smart(s)){if(out.length&&p.length<6&&out[out.length-1].length+p.length+1<=MAX)out[out.length-1]+=' '+p;else out.push(p)}state.subs=out.map(text=>({text,locked:false}));state.selected=0;state.page=0;save();render()}
function png(index){const o=document.createElement('canvas');o.width=W;o.height=H;draw(o,true,index);o.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=String(index+1).padStart(3,'0')+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)},'image/png')}
load();render();E('source').oninput=save;E('project').oninput=save;E('split').onclick=splitSource;E('savePng').onclick=()=>png(state.selected);E('resetPos').onclick=()=>{state.y=790;save();preview()};E('newProject').onclick=()=>{if(confirm('현재 작업을 새 작업으로 초기화할까요?')){state={project:'',source:'',subs:[{text:'',locked:false}],selected:0,page:0,y:790};localStorage.removeItem(KEY);load();render()}};E('lockPage').onclick=()=>{const s=state.page*10,e=Math.min(s+10,state.subs.length);for(let i=s;i<e;i++)state.subs[i].locked=true;save();render()};E('unlockPage').onclick=()=>{const s=state.page*10,e=Math.min(s+10,state.subs.length);for(let i=s;i<e;i++)state.subs[i].locked=false;save();render()};E('prev').onclick=()=>{if(state.page>0){state.page--;state.selected=state.page*10;save();render()}};E('next').onclick=()=>{const s=state.page*10,e=Math.min(s+10,state.subs.length),n=state.subs.slice(s,e).filter(x=>!x.locked).length;if(n&&!confirm('아직 확정하지 않은 자막이 '+n+'개 있습니다.\n그래도 다음으로 이동할까요?'))return;if((state.page+1)*10<state.subs.length){state.page++;state.selected=state.page*10;save();render()}};
</script></body></html>
